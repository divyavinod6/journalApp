spring:
  application:
    name: journalApp
  data:
    mongodb:
      auto-index-creation: true
      uri: ${MONGO_URI}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: weekly-sentiment-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring:
          json:
            trusted:
              packages: com.edigest.journalApp.model
    properties:
      security:
        protocol: SASL_SSL
      sasl:
        mechanism: PLAIN
        jaas:
          config: org.apache.kafka.common.security.plain.PlainLoginModule required username='${KAFKA_API_KEY}' password='${KAFKA_API_SECRET}';
      session:
        timeout:
          ms: 45000
      client:
        id: ccloud-springboot-client-130c9f18-6552-46d9-ae2b-a999e44ef380

server:
  port: 8081

logging:
  level:
    com.edigest.jounrnalApp: DEBUG

quotes:
  api:
    key: ${QUOTES_API_KEY}

weather:
  api:
    key: ${WEATHER_API_KEY}